name: Test push-to-registry multiple tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local Docker registry
        run: |
          docker run -d -p 5000:5000 --name multi-tag-registry registry:2
          # Wait for registry to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Waiting for registry... attempt $i"
            sleep 2
          done

      - name: Prepare test image
        run: |
          docker pull busybox:latest
          docker tag busybox:latest localhost:5000/multi-tag-image:latest
          docker tag busybox:latest localhost:5000/multi-tag-image:v1.0.0

      - id: push
        uses: .
        continue-on-error: true
        with:
          image: multi-tag-image
          tags: latest v1.0.0
          registry: localhost:5000
          tls-verify: 'false'

      - name: Assert multiple tags in registry-paths
        env:
          OUTCOME: ${{ steps.push.outcome }}
          REGISTRY_PATHS: ${{ steps.push.outputs.registry-paths }}
          REGISTRY_PATH: ${{ steps.push.outputs.registry-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "registry-paths: $REGISTRY_PATHS"
          echo "registry-path: $REGISTRY_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REGISTRY_PATHS" ]; then
              echo "FAIL: registry-paths output is empty on success"
              exit 1
            fi
            # Validate it's a JSON array with 2 elements (one per tag)
            COUNT=$(echo "$REGISTRY_PATHS" | python3 -c "import sys, json; data = json.load(sys.stdin); print(len(data))" 2>/dev/null)
            if [ -z "$COUNT" ]; then
              echo "FAIL: registry-paths is not valid JSON: $REGISTRY_PATHS"
              exit 1
            fi
            echo "Number of registry paths: $COUNT"
            if [ "$COUNT" -ne 2 ]; then
              echo "FAIL: expected 2 registry paths for 2 tags, got $COUNT: $REGISTRY_PATHS"
              exit 1
            fi
            # Check registry-path is the first element
            if [ -z "$REGISTRY_PATH" ]; then
              echo "FAIL: registry-path output is empty on success"
              exit 1
            fi
            FIRST=$(echo "$REGISTRY_PATHS" | python3 -c "import sys, json; data = json.load(sys.stdin); print(data[0])")
            if [ "$REGISTRY_PATH" != "$FIRST" ]; then
              echo "FAIL: registry-path '$REGISTRY_PATH' does not match first element of registry-paths '$FIRST'"
              exit 1
            fi
            echo "PASS: multiple tags pushed correctly, registry-paths=$REGISTRY_PATHS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (podman may not be available or image not in podman store)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Stop local registry
        if: always()
        run: |
          docker stop multi-tag-registry || true
          docker rm multi-tag-registry || true
