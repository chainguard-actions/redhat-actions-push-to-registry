name: Test push-to-registry with local registry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local Docker registry
        run: |
          docker run -d -p 5000:5000 --name test-registry registry:2
          # Wait for registry to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Waiting for registry... attempt $i"
            sleep 2
          done

      - name: Prepare test image
        run: |
          docker pull busybox:latest
          docker tag busybox:latest localhost:5000/test-image:latest
          # Make podman aware of the image if podman is available
          if command -v podman > /dev/null 2>&1; then
            podman pull docker-daemon:localhost:5000/test-image:latest 2>/dev/null || true
          fi

      - id: push
        uses: .
        continue-on-error: true
        with:
          image: test-image
          tags: latest
          registry: localhost:5000
          tls-verify: 'false'

      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.push.outcome }}
          REGISTRY_PATHS: ${{ steps.push.outputs.registry-paths }}
          REGISTRY_PATH: ${{ steps.push.outputs.registry-path }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "registry-paths: $REGISTRY_PATHS"
          echo "registry-path: $REGISTRY_PATH"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            # Validate registry-paths is a JSON array
            if [ -z "$REGISTRY_PATHS" ]; then
              echo "FAIL: registry-paths output is empty on success"
              exit 1
            fi
            # Check it's valid JSON array
            echo "$REGISTRY_PATHS" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Not a JSON array'" || {
              echo "FAIL: registry-paths is not a valid JSON array: $REGISTRY_PATHS"
              exit 1
            }
            # Check registry-path is set
            if [ -z "$REGISTRY_PATH" ]; then
              echo "FAIL: registry-path output is empty on success"
              exit 1
            fi
            echo "PASS: push succeeded with registry-paths=$REGISTRY_PATHS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (podman may not be available or image not found in podman store)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Stop local registry
        if: always()
        run: |
          docker stop test-registry || true
          docker rm test-registry || true
