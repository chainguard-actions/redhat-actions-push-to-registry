name: Test custom digestfile, extra-args and tls-verify false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake podman
        run: |
          mkdir -p /tmp/fakebin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-podman/podman" /tmp/fakebin/podman
          chmod +x /tmp/fakebin/podman
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          : > /tmp/fake-podman.log
      - id: action
        uses: .
        env:
          FAKE_DIGEST: sha256:feedface
        with:
          image: app
          tags: dev
          registry: localhost:5000
          tls-verify: "false"
          digestfile: /tmp/custom-digest.txt
          extra-args: |
            --format=v2s2
            --retry 3
      - name: Assert outputs
        env:
          PATH_OUT: ${{ steps.action.outputs.registry-path }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "registry-path: $PATH_OUT"
          echo "digest: $DIGEST"
          cat /tmp/fake-podman.log
          if [ "$PATH_OUT" != "localhost:5000/app:dev" ]; then
            echo "FAIL: registry-path"; exit 1
          fi
          if [ "$DIGEST" != "sha256:feedface" ]; then
            echo "FAIL: digest"; exit 1
          fi
          if [ "$(cat /tmp/custom-digest.txt)" != "sha256:feedface" ]; then
            echo "FAIL: custom digest file content"; exit 1
          fi
          grep -F -- "push --quiet --digestfile /tmp/custom-digest.txt app:dev localhost:5000/app:dev --format=v2s2 --retry 3 --tls-verify=false" /tmp/fake-podman.log || { echo "FAIL: push args"; exit 1; }
          echo "PASS"
