name: Test full image name tag validation (image not in storage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            apt-get update -qq || true
            apt-get install -y podman || true
          fi
          podman version || echo "podman not available"

      # When using full image name tags, image and registry inputs are ignored.
      # The action should still fail because the image doesn't exist in storage,
      # but it should NOT fail with "image must be provided" or "registry must be provided".
      - id: action
        uses: .
        with:
          tags: quay.io/someuser/nonexistent-image:latest
          tls-verify: 'false'
        continue-on-error: true

      - name: Assert action failed (image not in storage, not a validation error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when image does not exist in storage"
            exit 1
          fi
          echo "PASS: action correctly failed when full-name image was not found in storage"
