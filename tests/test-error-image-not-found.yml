name: Test error when image is in neither Podman nor Docker storage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake podman
        run: |
          mkdir -p /tmp/fakebin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-podman/podman" /tmp/fakebin/podman
          chmod +x /tmp/fakebin/podman
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          : > /tmp/fake-podman.log
      - id: action
        uses: .
        continue-on-error: true
        env:
          FAKE_IMAGE_EXISTS: "1"
          FAKE_DOCKER_PULL: "1"
        with:
          image: missing-image
          tags: v9
          registry: quay.io/user
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fake-podman.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"; exit 1
          fi
          grep -q "image exists missing-image:v9" /tmp/fake-podman.log || { echo "FAIL: podman storage not checked"; exit 1; }
          grep -q "pull docker-daemon:missing-image:v9" /tmp/fake-podman.log || { echo "FAIL: docker storage not checked"; exit 1; }
          if grep -qE "podman( --root [^ ]+)* push " /tmp/fake-podman.log; then
            echo "FAIL: push should not be attempted"; exit 1
          fi
          echo "PASS"
