name: Test authentication inputs (username and password)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            apt-get update -qq || true
            apt-get install -y podman || true
          fi
          podman version || echo "podman not available"

      - id: action
        uses: .
        with:
          image: nonexistent-image-for-auth-test
          tags: latest
          registry: quay.io/testuser
          username: testuser
          password: testpassword
          tls-verify: 'false'
        continue-on-error: true

      - name: Assert action failed (no real registry) but inputs were accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real registry/image), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when image does not exist, username and password inputs were accepted"
