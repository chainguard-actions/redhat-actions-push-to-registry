name: Test extra-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull a small image for testing
        run: |
          podman pull busybox:latest
          podman tag busybox:latest localhost/test-extra-args:latest

      - id: action
        uses: .
        continue-on-error: true
        with:
          image: test-extra-args
          tags: latest
          registry: localhost
          extra-args: |
            --tls-verify=false

      - name: Assert action ran with extra-args (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REGISTRY_PATHS: ${{ steps.action.outputs.registry-paths }}
        run: |
          echo "outcome: $OUTCOME"
          echo "registry-paths: $REGISTRY_PATHS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REGISTRY_PATHS" ]; then
              echo "FAIL: action succeeded but registry-paths output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with extra-args, registry-paths=$REGISTRY_PATHS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without a real registry)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
