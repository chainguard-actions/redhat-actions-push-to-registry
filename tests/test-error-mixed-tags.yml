name: Test error when mixing full name and short tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake podman
        run: |
          mkdir -p /tmp/fakebin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-podman/podman" /tmp/fakebin/podman
          chmod +x /tmp/fakebin/podman
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          : > /tmp/fake-podman.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          image: myimage
          registry: quay.io/user
          tags: quay.io/user/myimage:v1 latest
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PATH_OUT: ${{ steps.action.outputs.registry-path }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"; exit 1
          fi
          if [ -n "$PATH_OUT" ]; then
            echo "FAIL: no registry-path expected"; exit 1
          fi
          echo "PASS"
