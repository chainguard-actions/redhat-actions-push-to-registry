name: Test uppercase image/tag normalization and trailing slash registry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake podman
        run: |
          mkdir -p /tmp/fakebin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-podman/podman" /tmp/fakebin/podman
          chmod +x /tmp/fakebin/podman
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          : > /tmp/fake-podman.log
      - id: action
        uses: .
        with:
          image: MyImage
          tags: V1.0
          registry: quay.io/user/
      - name: Assert outputs
        env:
          PATH_OUT: ${{ steps.action.outputs.registry-path }}
          PATHS_OUT: ${{ steps.action.outputs.registry-paths }}
        run: |
          echo "registry-path: $PATH_OUT"
          echo "registry-paths: $PATHS_OUT"
          cat /tmp/fake-podman.log
          if [ "$PATH_OUT" != "quay.io/user/myimage:v1.0" ]; then
            echo "FAIL: registry-path"; exit 1
          fi
          if [ "$PATHS_OUT" != '["quay.io/user/myimage:v1.0"]' ]; then
            echo "FAIL: registry-paths"; exit 1
          fi
          grep -F -- "push --quiet --digestfile myimage-v1.0_digest.txt myimage:v1.0 quay.io/user/myimage:v1.0" /tmp/fake-podman.log || { echo "FAIL: push args"; exit 1; }
          echo "PASS"
